name: Pull request workflow

on:
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-publish-branch-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      -
        name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v3
        env:
          CI_REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.CI_REGISTRY_IMAGE }}:pr-${{ github.head_ref }}
  
  build-binaries:
    name: Build binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - uses: microsoft/setup-msbuild@v3

      - name: Build all binaries
        shell: pwsh
        run: ./buildReleaseAssets
      
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-files-pr-${{ github.event.pull_request.number }}
          path: publish/zippedFiles/
          if-no-files-found: error